<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIMS — Movements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
:root {
  --bg:        #0f1117;
  --surface:   #1a1d27;
  --surface2:  #22263a;
  --border:    #2a2d3a;
  --accent:    #4f8ef7;
  --accent-h:  #3a75e0;
  --text:      #e2e8f0;
  --muted:     #8892a4;
  --danger:    #e05252;
  --success:   #3ecf8e;
  --warning:   #f59e0b;
  --radius:    8px;
  --shadow:    0 4px 24px rgba(0,0,0,.35);
}
body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; font-size:14px; }
.topbar { position:sticky; top:0; z-index:100; background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:16px; padding:0 24px; height:56px; }
.topbar-brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:16px; }
.topbar-brand span { color:var(--accent); }
.topbar-actions { margin-left:auto; display:flex; align-items:center; gap:10px; }
.user-chip { font-size:12px; color:var(--muted); }
.btn { display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:var(--radius); font-size:13px; font-weight:500; cursor:pointer; border:none; font-family:inherit; transition:.15s; }
.btn-primary { background:var(--accent); color:#fff; }
.btn-primary:hover { background:var(--accent-h); }
.btn-ghost { background:transparent; color:var(--muted); border:1px solid var(--border); }
.btn-ghost:hover { background:var(--surface2); color:var(--text); }
.page { padding:24px; max-width:1200px; margin:0 auto; }
.section-hdr { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.section-hdr h2 { font-size:16px; font-weight:600; }
.table-wrap { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:auto; }
table { width:100%; border-collapse:collapse; }
thead th { padding:12px 14px; text-align:left; font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; border-bottom:1px solid var(--border); white-space:nowrap; }
tbody tr:hover { background:var(--surface2); }
tbody td { padding:11px 14px; border-bottom:1px solid var(--border); vertical-align:middle; }
#toast-container { position:fixed; bottom:24px; right:24px; display:flex; flex-direction:column; gap:8px; z-index:2000; }
.toast { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 18px; font-size:13px; min-width:220px; box-shadow:var(--shadow); animation:toastIn .25s ease; display:flex; align-items:center; gap:10px; }
.toast.success { border-left:3px solid var(--success); }
.toast.error   { border-left:3px solid var(--danger); }
.toast.info    { border-left:3px solid var(--accent); }
@keyframes toastIn { from{transform:translateX(40px);opacity:0} to{transform:translateX(0);opacity:1} }
</style>
</head>
<body>
<nav class="topbar">
  <div class="topbar-brand">📦 <span>Movements</span> <span style="font-weight:300;color:var(--muted)">Quantity Changes</span></div>
  <div class="topbar-actions">
    <span class="user-chip" id="userChip"></span>
    <a href="/" class="btn btn-ghost btn-sm">Dashboard</a>
    <a href="/logout" class="btn btn-ghost btn-sm">Sign Out</a>
  </div>
</nav>
<div class="page">
  <div class="section-hdr">
    <h2>Quantity Changes</h2>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Timestamp</th>
          <th>Device</th>
          <th>Serial/Asset</th>
          <th>Old Qty</th>
          <th>New Qty</th>
          <th>Change</th>
          <th>Reason</th>
          <th>User</th>
        </tr>
      </thead>
      <tbody id="movementsBody">
        <tr><td colspan="8" style="text-align:center;padding:30px;color:var(--muted)">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</div>
<div id="toast-container"></div>
<script>
function esc(str) { return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(msg, type='info') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  const icons = {success:'✅', error:'❌', info:'ℹ️'};
  el.innerHTML = `<span>${icons[type]||'ℹ️'}</span><span>${esc(msg)}</span>`;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => { el.style.transition='opacity .4s'; el.style.opacity='0'; setTimeout(()=>el.remove(),400); }, 3200);
}

document.addEventListener('DOMContentLoaded', () => {
  const user = '{{ session.get("display_name") or session.get("username") }}';
  document.getElementById('userChip').textContent = user ? `👤 ${user}` : '';
  loadMovements();
});

async function loadMovements() {
  try {
    const res = await fetch('/api/movements');
    const movements = await res.json();
    const tbody = document.getElementById('movementsBody');
    if (!movements.length) {
      tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--muted)">No quantity changes recorded.</td></tr>`;
      return;
    }
    tbody.innerHTML = movements.map(m => {
      const change = m.new_quantity - m.old_quantity;
      const changeColor = change > 0 ? 'var(--success)' : 'var(--danger)';
      return `
        <tr>
          <td style="font-size:12px;color:var(--muted);white-space:nowrap">${new Date(m.timestamp).toLocaleString()}</td>
          <td>${esc(m.device_name)}</td>
          <td>${esc(m.serial_number || m.asset_tag || '—')}</td>
          <td>${m.old_quantity}</td>
          <td>${m.new_quantity}</td>
          <td style="color:${changeColor};font-weight:600">${change > 0 ? '+' : ''}${change}</td>
          <td>${esc(m.reason || '—')}</td>
          <td>${esc(m.username)}</td>
        </tr>`;
    }).join('');
  } catch (e) {
    toast('Unable to load movements', 'error');
  }
}
</script>
</body>
</html>
